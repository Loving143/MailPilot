# Show SQL with parameters (recommended)
spring.jpa.properties.hibernate.type=trace
# Show SQL statements in the console
spring.jpa.show-sql=true

# Format SQL nicely (optional)
spring.jpa.properties.hibernate.format_sql=true

resume.path=D:/email/

spring.datasource.url=jdbc:postgresql://localhost:5432/emailoutreach
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#resend.api-key=re_1234567890abcdefXYZ


server.port=8091

# Logging Configuration
logging.level.com.email=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log file configuration
logging.file.name=logs/emailoutreach.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Web Configuration - Disable default static resource handling
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
